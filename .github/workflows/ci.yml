name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PowerShell
        uses: Amadevus/pwsh-script@v2

      - name: Validate package metadata
        run: |
          $manifest = Get-Content manifest.json | ConvertFrom-Json
          if ($manifest.name -ne "hermes-feishu-adapter-optimization") { throw "Unexpected package name" }
          Get-Content patches/source.replacements.json | ConvertFrom-Json | Out-Null
          $null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw ./verify.ps1))

      - name: Check manifest version
        run: |
          $manifest = Get-Content manifest.json | ConvertFrom-Json
          Write-Host "Package: $($manifest.name)"
          Write-Host "Version: $($manifest.version)"
          if ($manifest.version -ne "${{ github.ref_name }}".TrimStart('v')) {
            Write-Host "Warning: Version mismatch"
          }
